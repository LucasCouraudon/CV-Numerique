<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiaomi - Connexion</title>
    <link rel="stylesheet" href="./css/connexion.css">
</head>
<body>
<main>
    <form action="index.html" method="POST">
        <h1>Connexion</h1>

        <p style="font-size: 0.8rem; color: red; text-align: center; margin-bottom: 1rem;">
            Ceci est une simulation esthétique (aucune vérification de compte).<br>
            Veuillez simplement saisir un email au format valide.
        </p>

        <section class="box">
            <label for="email-co" class="visually-hidden">Adresse mail</label>
            <input type="email" id="email-co" placeholder="Adresse mail" required>
        </section>
        <section class="box">
            <label for="password-co" class="visually-hidden">Mot de Passe</label>
            <input type="password" id="password-co" placeholder="Mot de Passe" required>
        </section>
        <section class="SouvenirMoi">
            <label><input type="checkbox" name="remember-me">Se souvenir de moi ?</label>
            <a href="#">Mot de passe oublié ?</a>
        </section>
        <button type="submit" class="cobouton">Connexion</button>
        <p class="separator">Ou se connecter avec :</p>
        <section class="boutonmultiple">
            <button type="submit" class="cogoogle" formaction="#" aria-label="Connexion avec Google"><img src="./img/google.png" alt="Logo Google">Google</button>
            <button type="submit" class="cofacebook" formaction="#" aria-label="Connexion avec Facebook"><img src="./img/facebook.png" alt="Logo Facebook">Facebook</button>
        </section>
    </form>
</main>
</body>
</html>
