<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiaomi - Ajouter votre trajet</title>
    <link rel="stylesheet" href="./css/publierTraj.css">
</head>
<body>
<main>
    <h1>Publier votre trajet</h1>
    <section class="form-container">
        <img src="img/1000x617.png" alt="Vue d'un tableau de bord de voiture sur une route">
        <form action="./covoiturage.html" method="POST">
            <section class="form-group">
                <label for="depart">Départ :</label>
                <input type="text" id="depart" name="depart" placeholder="Ex : La Chaux-de-Fonds" required>
            </section>

            <section class="form-group">
                <label for="arrivee">Arrivée :</label>
                <input type="text" id="arrivee" name="arrivee" placeholder="Ex : Marin-Epagnier" required>
            </section>

            <section class="form-group">
                <label for="date">Date du trajet :</label>
                <input type="date" id="date" name="date" required>
            </section>

            <section class="form-group">
                <label for="heure">Heure de départ :</label>
                <input type="time" id="heure" name="heure" required>
            </section>

            <section class="form-group">
                <label for="tarifs">Tarifs (€) :</label>
                <input type="number" step="0.01" min="0" id="tarifs" name="tarifs" placeholder="Ex : 9.99" required>
            </section>

            <section class="form-group">
                <label for="description">Description (max 200 mots) :</label>
                <textarea id="description" name="description" placeholder="Ex : 3 places disponibles, petite pause à mi-chemin..." maxlength="200"></textarea>
            </section>

            <button type="submit">Publier votre trajet</button>
        </form>
    </section>
</main>
</body>
</html>
