<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiaomi - Ajouter votre Location</title>
    <link rel="stylesheet" href="./css/publierTraj.css">
</head>
<body>
<main>
    <h1>Publier votre Location</h1>
    <section class="form-container">
        <img src="img/voiture.jpg" alt="Voiture compacte rouge garée">
        <form action="./location.html" method="POST">
            <section class="form-group">
                <label for="ville">Ville :</label>
                <input type="text" id="ville" name="ville" placeholder="Ex : La Chaux-de-Fonds" required>
            </section>

            <section class="form-group">
                <label for="moyen-de-transports">Moyen de transport :</label>
                <input type="text" id="moyen-de-transports" name="moyen-de-transports" placeholder="Ex : Scooter électrique / Vélo / Voiture" required>
            </section>

            <section class="form-group">
                <label for="duree">Durée de location (Ex: Jour/Semaine/Mois) :</label>
                <input type="text" id="duree" name="duree" placeholder="Ex : Journée / Semaine / 1 mois" required>
            </section>

            <section class="form-group">
                <label for="tarifs">Tarifs (€) :</label>
                <input type="number" step="0.01" min="0" id="tarifs" name="tarifs" placeholder="Ex : 99.99" required>
            </section>

            <section class="form-group">
                <label for="description">Description (Facultatif) :</label>
                <textarea id="description" name="description" placeholder="Ex : Modèle 2024, autonomie 50km..."></textarea>
            </section>

            <button type="submit">Publier votre Location</button>
        </form>
    </section>
</main>
</body>
</html>
